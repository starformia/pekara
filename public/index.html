<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#a4531f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bread Route">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bread Route — delivery & payment tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fbf3e4;--card:#fffaf1;--ink:#3a2412;--mut:#8b7358;--crust:#a4531f;--crust2:#7d3b14;--gold:#e8a83a;--ok:#2f7d4f;--okbg:#e1f1e5;--warn:#9a5a05;--warnbg:#fdeccb;--bad:#b3352a;--badbg:#fbdcd6;--line:#ecdcbe;--r:18px}
html{background:var(--bg)}
html.lock,html.lock body{overflow:hidden}
body{margin:0;color:var(--ink);font:16px/1.4 'DM Sans',system-ui,sans-serif;padding-bottom:96px;min-height:100vh;
background:radial-gradient(1200px 380px at 50% -120px,#f6dfae 0,transparent 70%),var(--bg)}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.top{position:sticky;top:0;z-index:20;background:rgba(251,243,228,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.logo{font-family:'Fraunces',serif;font-weight:800;font-size:20px;color:var(--crust2);display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 1px 0 #fff inset,0 6px 18px -12px rgba(120,60,10,.35);position:relative}
.card h3{font-size:17px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.wrapr{flex-wrap:wrap}
.sp{flex:1;min-width:0}
.mut{color:var(--mut)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:'Fraunces',serif;font-size:24px;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.gray{background:#f0e5cd;color:var(--mut)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--crust);color:#fff;min-height:44px;font-size:15px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--crust2);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sm{padding:6px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn.dangerghost{background:transparent;color:var(--bad);border:1.5px solid #efc3bc}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.full{width:100%}
input,select,textarea{display:block;width:100%;max-width:100%;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:46px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#8b7358 50%),linear-gradient(135deg,#8b7358 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=date]{text-align:left}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,168,58,.25)}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:14px 0 4px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:9px 4px 8px;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{font-style:normal;font-size:21px;filter:grayscale(.7)}
.nav button.on{color:var(--crust2)}.nav button.on i{filter:none}
.fab{position:fixed;right:16px;bottom:84px;z-index:25;border-radius:99px;padding:0 20px;height:52px;box-shadow:0 8px 22px -6px rgba(125,59,20,.6);font-size:16px}
.seg{display:flex;background:#f3e6c9;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:700;color:var(--mut);cursor:pointer;font-size:14px;min-height:38px}
.seg button.on{background:#fff;color:var(--crust2);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.list>.it{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.list>.it:first-child{border-top:0}
.day{font-family:'Fraunces',serif;font-weight:800;margin:18px 2px 6px;display:flex;justify-content:space-between;color:var(--crust2)}
.dl{cursor:pointer;overflow:hidden}
.stamp{position:absolute;right:12px;top:12px;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:0 7px;font-weight:800;letter-spacing:.12em;font-size:12px;transform:rotate(-7deg);opacity:.9}
.bars{display:flex;gap:6px;align-items:flex-end;height:118px;margin-top:6px}
.bars div.b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut);min-width:0}
.bars i{display:block;width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:linear-gradient(#e8a83a,#c9812a);min-height:3px}
.bars .t i{background:linear-gradient(#c8612a,#8c3d12)}
.bars em{font-style:normal;font-weight:700;color:var(--ink);font-size:12px}
.ringwrap{display:flex;align-items:center;gap:14px}
.meter{height:12px;border-radius:99px;background:var(--badbg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* ---- sheets: header + footer stay fixed, only the middle scrolls ---- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(40,20,5,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet.conf{z-index:80;align-items:center;padding:18px}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;border-radius:24px 24px 0 0;animation:up .22s ease-out;overflow:hidden}
.panel.tall{height:90vh;height:90dvh}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ph{flex:none;display:flex;align-items:center;gap:10px;padding:14px 14px 12px 18px;border-bottom:1px solid var(--line);background:var(--bg)}
.ph h2{flex:1;min-width:0;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x,.bk{flex:none;background:#f0e1c0;border:0;border-radius:50%;width:40px;height:40px;font-size:19px;cursor:pointer;color:var(--crust2);font-weight:700}
.pb{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 16px 20px}
.pf{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.cbox{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:up .15s ease-out}
.cbox h3{font-size:20px;margin-bottom:6px}
.prow{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:#fff}
.prow.on{border-color:var(--gold);background:#fffaf0}
.stepper{display:flex;gap:6px;align-items:center;margin-top:8px}
.stepper button{border:0;background:#f3e6c9;border-radius:10px;min-width:42px;height:44px;font-weight:800;cursor:pointer;color:var(--crust2);flex:none}
.stepper input.q{text-align:center;font-weight:800;font-size:18px;width:64px;flex:none;padding:8px 4px}
.pricebox{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--mut);min-width:0}
.pricebox input{width:84px;min-height:44px;padding:8px 8px;text-align:right}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#3a2412;color:#fff;padding:10px 16px;border-radius:12px;z-index:95;display:none;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.3);align-items:center;gap:12px}
.toast.on{display:flex}.toast button{background:none;border:0;color:var(--gold);font-weight:800;cursor:pointer}
.center{min-height:100vh;display:grid;place-items:center;padding:18px}
.auth{width:100%;max-width:400px;text-align:center}
.auth .hero{font-size:64px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(-4deg)}}
.auth h1{font-size:32px;color:var(--crust2)}
.auth .card{text-align:left}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:20px;margin-top:8px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lang{background:none;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer;color:var(--mut)}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;margin-top:10px}
table.t{width:100%;border-collapse:collapse}table.t td{padding:6px 0;border-top:1px solid var(--line)}table.t td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:8px}
table.t tr:first-child td{border-top:0}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty b{display:block;font-size:40px}
textarea.copy{min-height:170px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.bizbtns{display:flex;gap:8px;margin-top:10px}
.bizbtns .btn{flex:1;padding:6px 8px}
.statline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.statline:first-child{border-top:0}.statline b{text-align:right}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"><div class="ph"><button class="bk" id="pbk" data-act="back" style="display:none">‹</button><h2 id="pt"></h2><button class="x" data-act="close" aria-label="Close">✕</button></div><div class="pb" id="pb"></div><div class="pf" id="pf" style="display:none"></div></div></div>
<div id="confirm" class="sheet conf"><div class="cbox"><h3 id="cq"></h3><p class="mut" id="cm" style="margin:0 0 16px"></p><div class="row"><button class="btn ghost sp" data-act="cno" id="cn"></button><button class="btn bad sp" data-act="cyes" id="cy"></button></div></div></div>
<div id="toast" class="toast"></div>
<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
let lang=ls('bk_lang')||((navigator.language||'').startsWith('mk')?'mk':'en');
const L=(en,mk)=>lang==='mk'?mk:en;
const money=n=>Math.round(n||0).toLocaleString('en-US')+(lang==='mk'?' ден.':' MKD');
const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>ymd(new Date());
const daysAgo=n=>ymd(new Date(Date.now()-n*864e5));
const pd=s=>new Date(s+'T12:00:00');
const loc=()=>lang==='mk'?'mk-MK':'en-GB';
const fmtD=s=>pd(s).toLocaleDateString(loc(),{weekday:'short',day:'numeric',month:'short'});
const fmtT=iso=>{const d=new Date(iso);return ymd(d)===today()?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString(loc(),{day:'numeric',month:'short'})};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const plural=(n,one,many)=>n===1?one:many;

const S={boot:true,needsSetup:false,me:null,staff:[],clients:[],products:[],deliveries:[],expenses:[],monthly:[],cashdays:[],xm:today().slice(0,7),mt:'exp',tr:6,cd:today(),settings:{},version:'',view:'home',
  f:{range:'week',status:'all',client:''},q:'',screen:'',err:'',offline:false,bp:'30',dirty:false};
let D={byC:{}};
const acts={};

/* ================= api ================= */
async function api(path,method='GET',body){
  const r=await fetch('/api/'+path,{method,headers:{'content-type':'application/json'},credentials:'same-origin',body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status,code:j.error,msg:j.message});
  return j;
}
const ERR={invalid_credentials:['Wrong username or password','Погрешно корисничко име или лозинка'],locked:['Too many attempts — wait 10 minutes','Премногу обиди — почекај 10 минути'],
weak_password:['Password needs at least 6 characters','Лозинката мора да има најмалку 6 знаци'],bad_username:['Username: 3–30 letters/numbers (a-z, 0-9, . _ -)','Корисничко име: 3–30 букви/бројки (a-z, 0-9, . _ -)'],
username_taken:['That username is taken','Тоа корисничко име е зафатено'],name_taken:['A business with this name already exists','Веќе постои фирма со ова име'],
not_yours:['Only the person who added it (or an owner) can change this','Само тој што го внел (или сопственик) може да го смени'],
admin_only:['Only an owner can do this','Само сопственик може ова'],has_deliveries:['This business has deliveries','Фирмата има достави'],
last_admin:['There must be at least one owner','Мора да има барем еден сопственик'],wrong_current:['Current password is wrong','Тековната лозинка е погрешна'],
email_not_configured:['Email isn’t set up yet — add SMTP_USER and SMTP_PASS in Vercel (see README)','Е-поштата не е подесена — додади SMTP_USER и SMTP_PASS во Vercel (види README)'],bad_email:['That email address doesn’t look right','Е-адресата не изгледа точно'],bad_amount:['Enter an amount','Внеси износ'],
cannot_remove_self:['You can’t remove yourself','Не можеш да се избришеш себеси'],no_items:['Add at least one bread','Додади барем еден леб']};
const errText=e=>{const m=ERR[e.code];return m?L(m[0],m[1]):(e.msg||e.message||'Error')};
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#app').contains(a)};

async function sync(force){
  try{
    const j=await api('sync'+(!force&&S.version?'?v='+encodeURIComponent(S.version):''));
    S.offline=false;
    if(j.same)return;
    Object.assign(S,{version:j.version,me:j.me,staff:j.staff,clients:j.clients,products:j.products,deliveries:j.deliveries,expenses:j.expenses||[],monthly:j.monthly||[],cashdays:j.cashdays||[],settings:j.settings||{}});
    if(typing()&&!force){S.dirty=true;return}
    render();
  }catch(e){
    if(e.status===401){S.me=null;S.screen='';S.version='';render()}
    else if(!S.offline){S.offline=true;toast(L('No connection — will retry','Нема врска — повторно ќе пробам'))}
  }
}
async function w(fn){try{await fn();await sync(true);return true}catch(e){toast(errText(e));return false}}
async function boot(){
  try{const j=await api('session');S.needsSetup=j.needsSetup;S.bakery=j.bakery;if(j.me){S.me=j.me;await sync(true)}}
  catch(e){S.err=e.msg||e.message||'Error'}
  S.boot=false;render();
  setInterval(()=>{if(S.me&&!document.hidden)sync()},8000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.me)sync()});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty&&!typing()){S.dirty=false;render()}},250));
}

/* ================= derived data ================= */
const paidOf=d=>(d.pays||[]).reduce((a,p)=>a+p.a,0);
const dueOf=d=>Math.max(0,d.total-paidOf(d));
const loavesOf=d=>(d.items||[]).reduce((a,i)=>a+i.q,0);
const clientName=id=>(S.clients.find(c=>c.id===id)||{name:'—'}).name;
const isAdmin=()=>S.me&&S.me.role==='admin';
const prodsSorted=()=>S.products.slice().sort((a,b)=>(a.o||0)-(b.o||0));
const priceFor=(c,p)=>(c&&c.prices&&c.prices[p.id])||p.price;
function derive(){
  const m={};const blank=()=>({due:0,oldest:null,loaves:0,paid:0,total:0,last:null,n:0,late:0,over15:0});const cm={};for(const c of S.clients)cm[c.id]=c;const td=today();
  for(const c of S.clients)m[c.id]=blank();
  for(const d of S.deliveries){const c=m[d.cid]||(m[d.cid]=blank());
    const due=dueOf(d);c.n++;c.loaves+=loavesOf(d);c.total+=d.total;c.paid+=paidOf(d);
    if(due>0){c.due+=due;if(!c.oldest||d.date<c.oldest)c.oldest=d.date;const age=daysBetween(d.date,td),terms=cm[d.cid]&&cm[d.cid].terms!=null?cm[d.cid].terms:7;if(age-terms>c.late)c.late=age-terms;if(age>15)c.over15+=due}
    if(!c.last||d.date>c.last.date||(d.date===c.last.date&&d.at>c.last.at))c.last=d}
  D.byC=m;S.deliveries.sort((a,b)=>b.date.localeCompare(a.date)||b.at.localeCompare(a.at));
}
const chip=(c,t)=>`<span class="chip ${c}">${t}</span>`;
const statusChip=d=>{const due=dueOf(d);return due<=0?chip('ok','✓ '+L('Paid','Платено')):paidOf(d)>0?chip('warn',L('Partial','Делумно')+' · '+money(due)):chip('bad',L('Unpaid','Неплатено'))};
const ageChip=c=>{if(!c||c.due<=0)return chip('ok','✓ '+L('All paid','Платено'));
  return c.late>0?chip('bad',L('Overdue '+c.late+'d','Задоцнето '+c.late+'д')):chip('warn',L('Owes','Должи'))};
const WD=[[1,'Mon','Пон'],[2,'Tue','Вто'],[3,'Wed','Сре'],[4,'Thu','Чет'],[5,'Fri','Пет'],[6,'Sat','Саб'],[0,'Sun','Нед']];
const hasStanding=(c,wd)=>!!(c&&c.standing&&c.standing.days&&c.standing.items&&(wd===undefined?c.standing.days.length:c.standing.days.includes(wd))&&Object.values(c.standing.items).some(q=>q>0));
const standDays=c=>WD.filter(w=>c.standing.days.includes(w[0])).map(w=>L(w[1],w[2])).join(', ');
const standText=c=>Object.entries(c.standing.items).map(([pid,q])=>{const p=S.products.find(x=>x.id===pid);return p?`${esc(p.e)} ${esc(p.n)} ×${q}`:''}).filter(Boolean).join(' · ');
const itemsText=d=>(d.items||[]).map(i=>`${esc(i.e)} ${esc(i.n)} ×${i.q}`).join(' · ');
const avatar=(u,sz)=>`<span class="av" style="background:${esc(u.color||'#a4531f')};${sz?`width:${sz}px;height:${sz}px`:''}">${esc((u.name||'?').trim()[0]||'?').toUpperCase()}</span>`;

/* ================= toast / sheet / confirm ================= */
let tt;
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`+(undo?`<button id="undo">${L('Undo','Врати')}</button>`:'');t.classList.add('on');
  if(undo)$('#undo').onclick=()=>{t.classList.remove('on');undo()};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),undo?6000:3200)}
let backFn=null;
function openSheet({title,body,footer,tall,back}){
  $('#pt').textContent=title||'';$('#pb').innerHTML=body||'';
  const f=$('#pf');f.innerHTML=footer||'';f.style.display=footer?'block':'none';
  $('#panel').classList.toggle('tall',!!tall);
  backFn=back||null;$('#pbk').style.display=back?'block':'none';
  $('#sheet').classList.add('open');document.documentElement.classList.add('lock');$('#pb').scrollTop=0;
}
function closeSheet(){$('#sheet').classList.remove('open');document.documentElement.classList.remove('lock');backFn=null}
let confirmFn=null;
function confirmBox({title,msg,ok,onOk}){
  $('#cq').textContent=title;$('#cm').textContent=msg||'';$('#cn').textContent=L('Cancel','Откажи');$('#cy').textContent=ok||L('Delete','Избриши');
  confirmFn=onOk;$('#confirm').classList.add('open');
}
acts.cno=()=>{$('#confirm').classList.remove('open');confirmFn=null};
acts.cyes=async()=>{const f=confirmFn;$('#confirm').classList.remove('open');confirmFn=null;if(f)await f()};
acts.close=closeSheet;
acts.back=()=>{if(backFn)backFn()};

/* ================= render ================= */
function render(){
  const app=$('#app');derive();S.dirty=false;
  if(S.boot){app.innerHTML=`<div class="center"><div class="auth"><div class="hero">🥖</div><p class="mut">${L('Warming up the oven…','Ја загреваме печката…')}</p></div></div>`;return}
  if(S.err){app.innerHTML=`<div class="center"><div class="auth card"><h3>⚠️ ${L('Can’t reach the server','Не може да се поврзе')}</h3><p class="mut small">${esc(S.err)}</p><button class="btn full" onclick="location.reload()">${L('Try again','Обиди се повторно')}</button></div></div>`;return}
  if(S.needsSetup){if(S.screen!=='setup'){S.screen='setup';app.innerHTML=setupHTML()}return}
  if(!S.me){if(S.screen!=='login'){S.screen='login';app.innerHTML=loginHTML()}return}
  S.screen='app';const y=window.scrollY;
  const nav=[['home','🏠',L('Today','Денес')],['biz','🏪',L('Businesses','Фирми')],['dels','🧾',L('Deliveries','Достави')]];
  if(isAdmin())nav.push(['exp','💰',L('Money','Пари')]);nav.push(['set','⚙️',L('Team','Тим')]);
  if(S.view==='exp'&&!isAdmin())S.view='home';
  const views={home,dels:deliveriesView,biz:clientsView,exp:moneyView,set:settingsView};
  app.innerHTML=`<div class="top"><div class="wrap"><div class="logo"><span>🥖</span><span class="n">${esc(S.settings.bakery||'Bread Route')}</span></div>
  <div class="me">${avatar(S.me)}<span>${esc(S.me.name)}</span></div></div></div>
  <div class="wrap">${S.offline?`<div class="banner">${L('Offline — showing last data','Без врска — последни податоци')}</div>`:''}${views[S.view]()}</div>
  ${S.view==='exp'?(S.mt==='exp'?`<button class="btn fab" data-act="newexp">＋ ${L('Expense','Трошок')}</button>`:S.mt==='cash'?`<button class="btn fab" data-act="newpay">＋ ${L('Payment','Плаќање')}</button>`:''):`<button class="btn fab" data-act="newdel">＋ ${L('Delivery','Достава')}</button>`}
  <div class="nav">${nav.map(n=>`<button class="${S.view===n[0]?'on':''}" data-act="nav" data-v="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('')}</div>`;
  window.scrollTo(0,y);
}

<p class="mut">${L('Sign in to see deliveries & payments','Најави се за достави и плаќања')}</p>

  catch(e){$('#l-err').textContent=errText(e);const c=$('.auth .card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}

function setLang(){lang=lang==='en'?'mk':'en';ls('bk_lang',lang);S.screen='';render()}
acts.setup=async()=>{

  :[{n:'White loaf',e:'🍞',price:35},{n:'Whole-wheat loaf',e:'🍞',price:45},{n:'Baguette',e:'🥖',price:30},{n:'Croissant',e:'🥐',price:20}];
  try{await api('setup','POST',{bakery:$('#s-bak').value,name:$('#s-name').value,username:$('#s-user').value,password:$('#s-pass').value,products});

acts.logout=async()=>{try{await api('session','DELETE')}catch(e){}closeSheet();S.me=null;S.version='';S.screen='';render()};

/* ================= HOME ================= */
function home(){
  const td=today(),h=new Date().getHours();
  const hello=h<12?L('Good morning','Добро утро'):h<18?L('Good afternoon','Добар ден'):L('Good evening','Добра вечер');
  const todayD=S.deliveries.filter(d=>d.date===td);
  const tl=todayD.reduce((a,d)=>a+loavesOf(d),0);
  const byC=Object.entries(D.byC);
  const owed=byC.reduce((a,[,c])=>a+c.due,0),owing=byC.filter(([,c])=>c.due>0).length;
  const wk0=daysAgo(6);let coll=0;
  for(const d of S.deliveries)for(const p of d.pays||[])if(ymd(new Date(p.t))>=wk0)coll+=p.a;
  const ms=td.slice(0,7),md=S.deliveries.filter(d=>d.date.startsWith(ms));
  const mt=md.reduce((a,d)=>a+d.total,0),mp=md.reduce((a,d)=>a+paidOf(d),0),pct=mt?Math.round(mp/mt*100):0;
  const C=2*Math.PI*34;
  const days=[...Array(7)].map((_,i)=>{const dt=daysAgo(6-i);return{dt,n:S.deliveries.filter(d=>d.date===dt).reduce((a,d)=>a+loavesOf(d),0)}});
  const mx=Math.max(1,...days.map(d=>d.n));
  const notYet=S.clients.filter(c=>!todayD.some(d=>d.cid===c.id)).sort((a,b)=>(D.byC[b.id].last?1:0)-(D.byC[a.id].last?1:0)||a.name.localeCompare(b.name));
  const top=S.clients.filter(c=>D.byC[c.id].due>0).sort((a,b)=>D.byC[b.id].due-D.byC[a.id].due).slice(0,5);
  const o15=S.clients.filter(c=>D.byC[c.id].over15>0).sort((a,b)=>D.byC[b.id].over15-D.byC[a.id].over15),o15s=o15.reduce((a,c)=>a+D.byC[c.id].over15,0);
  const wdN=new Date().getDay(),wdT=(wdN+1)%7;
  const stToday=S.clients.filter(c=>hasStanding(c,wdN)&&!todayD.some(d=>d.cid===c.id));
  const bake={};for(const c of S.clients)if(hasStanding(c,wdT))for(const [pid,q] of Object.entries(c.standing.items)){if(S.products.some(x=>x.id===pid))bake[pid]=(bake[pid]||0)+q}
  const extra=(o15.length?`<div class="card" style="border-color:#e7b3aa;background:#fff4f1"><h3 style="color:var(--bad)">⚠️ ${L('Unpaid for more than 15 days','Неплатено повеќе од 15 дена')}</h3><div class="serif" style="font-size:28px;color:var(--bad);margin-bottom:6px">${money(o15s)}</div><div class="list">${o15.map(c=>`<div class="it" data-act="client" data-id="${c.id}"><div class="sp"><b>${esc(c.name)}</b></div><b style="color:var(--bad)">${money(D.byC[c.id].over15)}</b><span class="mut">›</span></div>`).join('')}</div></div>`:'')
  +(stToday.length?`<div class="card"><div class="row"><h3 class="sp" style="margin:0">📅 ${L('Standing orders today','Стални нарачки денес')}</h3><button class="btn sm" data-act="standall">${L('Deliver all','Достави сите')} (${stToday.length})</button></div><div class="list" style="margin-top:6px">${stToday.map(c=>`<div class="it"><div class="sp"><b>${esc(c.name)}</b><div class="small mut">${standText(c)}</div></div><button class="btn sm" data-act="stand" data-id="${c.id}">✓ ${L('Deliver','Достави')}</button></div>`).join('')}</div></div>`:'')
  +(Object.keys(bake).length?`<div class="card"><h3>🥖 ${L('Tomorrow’s bake list','Утре за печење')} <span class="small mut" style="font-family:'DM Sans';font-weight:400">· ${L('from standing orders','од стални нарачки')}</span></h3>${Object.entries(bake).map(([pid,q])=>{const p=S.products.find(x=>x.id===pid);return `<div class="statline"><span>${esc(p.e)} ${esc(p.n)}</span><b>${q}</b></div>`}).join('')}<div class="statline"><span class="mut">${L('Total','Вкупно')}</span><b>${Object.values(bake).reduce((a,b)=>a+b,0)} 🍞</b></div></div>`:'');
  const ev=[];for(const d of S.deliveries){ev.push({t:d.at,x:`<b>${esc(d.bn)}</b> ${L('delivered','достави')} ${loavesOf(d)} 🍞 ${L('to','на')} <b>${esc(clientName(d.cid))}</b>`});
    for(const p of d.pays||[])ev.push({t:p.t,x:`<b>${esc(p.bn)}</b> ${L('collected','наплати')} ${money(p.a)} ${L('from','од')} <b>${esc(clientName(d.cid))}</b> 💰`})}
  ev.sort((a,b)=>b.t.localeCompare(a.t));
  if(!S.clients.length)return `<div class="card empty"><b>🏪</b><h3>${hello}, ${esc(S.me.name)}!</h3><p>${L('Start by adding the businesses you deliver bread to.','Започни со додавање на фирмите на кои им доставуваш леб.')}</p><button class="btn" data-act="newclient">＋ ${L('Add first business','Додади прва фирма')}</button></div>`;
  return `<div class="card" style="background:linear-gradient(135deg,#fff3d6,#fffaf1)"><div class="ringwrap">
  <svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="34" fill="none" stroke="#f0dfbd" stroke-width="10"/><circle cx="43" cy="43" r="34" fill="none" stroke="${pct>=80?'#2f7d4f':pct>=50?'#e8a83a':'#b3352a'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 43 43)"/><text x="43" y="49" text-anchor="middle" font-family="Fraunces,serif" font-weight="800" font-size="20" fill="#3a2412">${pct}%</text></svg>
  <div class="sp"><h2 style="font-size:21px">${hello}, ${esc(S.me.name)} ${h<12?'☀️':h<18?'🌤':'🌙'}</h2><div class="mut small">${new Date().toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'})}</div>
  <div class="small" style="margin-top:4px">${L('This month you’ve been paid for','Овој месец е наплатено')} <b>${pct}%</b> ${L('of your deliveries','од доставите')}</div></div></div></div>
  ${extra}
  <div class="grid2"><div class="kpi"><span class="mut small">${L('Delivered today','Доставено денес')}</span><b>${tl} 🍞</b><span class="small mut">${todayD.length} ${plural(todayD.length,L('stop','место'),L('stops','места'))}</span></div>
  <div class="kpi bad"><span class="mut small">${L('Still owed','Уште се должи')}</span><b>${money(owed)}</b><span class="small mut">${owing} ${plural(owing,L('business','фирма'),L('businesses','фирми'))}</span></div>
  <div class="kpi ok"><span class="mut small">${L('Collected (7 days)','Наплатено (7 дена)')}</span><b>${money(coll)}</b></div>
  <div class="kpi"><span class="mut small">${L('Month sales','Продажба (месец)')}</span><b>${money(mt)}</b></div></div>
  <div class="card"><h3>${L('Loaves per day','Леб по ден')}</h3><div class="bars">${days.map(d=>`<div class="b ${d.dt===td?'t':''}"><em>${d.n||''}</em><i style="height:${Math.max(3,d.n/mx*72)}px"></i>${pd(d.dt).toLocaleDateString(loc(),{weekday:'narrow'})}</div>`).join('')}</div></div>
  ${top.length?`<div class="card"><h3>💰 ${L('Needs collecting','За наплата')}</h3><div class="list">${top.map(c=>`<div class="it" data-act="client" data-id="${c.id}"><div class="sp"><b>${esc(c.name)}</b><div class="small mut">${L('oldest unpaid','најстаро неплатено')}: ${fmtD(D.byC[c.id].oldest)}</div></div><div style="text-align:right"><b>${money(D.byC[c.id].due)}</b><div>${ageChip(D.byC[c.id])}</div></div></div>`).join('')}</div></div>`:`<div class="card empty"><b>🎉</b>${L('Everyone has paid. Nice!','Сите платиле. Одлично!')}</div>`}
  ${notYet.length?`<div class="card"><h3>🚚 ${L('Not delivered yet today','Уште недоставено денес')}</h3><div class="list">${notYet.slice(0,6).map(c=>{const l=D.byC[c.id].last;return `<div class="it"><div class="sp" data-act="client" data-id="${c.id}"><b>${esc(c.name)}</b><div class="small mut">${l?L('last','последно')+': '+loavesOf(l)+' 🍞 · '+fmtD(l.date):L('no deliveries yet','нема достави')}</div></div>
  ${l?`<button class="btn sm" data-act="repeat" data-id="${c.id}">↻ ${L('Repeat','Повтори')}</button>`:`<button class="btn sm ghost" data-act="newdel" data-id="${c.id}">＋</button>`}</div>`}).join('')}</div>${notYet.length>6?`<div class="small mut" style="margin-top:6px">+${notYet.length-6} ${L('more in Businesses','уште во Фирми')}</div>`:''}</div>`:''}
  ${ev.length?`<div class="card"><h3>🕑 ${L('Latest activity','Последни активности')}</h3><div class="list">${ev.slice(0,8).map(e=>`<div class="it" style="cursor:default"><div class="sp small">${e.x}</div><span class="mut small">${fmtT(e.t)}</span></div>`).join('')}</div></div>`:''}`;
}

/* ================= DELIVERIES TAB ================= */
function deliveriesView(){
  const f=S.f,td=today(),r0={today:td,week:daysAgo(6),month:td.slice(0,8)+'01',all:'0000'}[f.range];
  const list=S.deliveries.filter(d=>d.date>=r0&&(!f.client||d.cid===f.client)&&(f.status==='all'||(f.status==='paid'?dueOf(d)<=0:dueOf(d)>0)));
  const tot=list.reduce((a,d)=>a+d.total,0),due=list.reduce((a,d)=>a+dueOf(d),0),lv=list.reduce((a,d)=>a+loavesOf(d),0);
  const seg=(k,opts)=>`<div class="seg">${opts.map(o=>`<button class="${f[k]===o[0]?'on':''}" onclick="setF('${k}','${o[0]}')">${o[1]}</button>`).join('')}</div>`;
  let html=`<div style="margin:12px 0 8px">${seg('range',[['today',L('Today','Денес')],['week',L('7 days','7 дена')],['month',L('Month','Месец')],['all',L('All','Сите')]])}</div>
  <div style="margin-bottom:8px">${seg('status',[['all',L('All','Сите')],['unpaid',L('Unpaid','Неплатени')],['paid',L('Paid','Платени')]])}</div>
  <select onchange="setF('client',this.value)"><option value="">${L('All businesses','Сите фирми')}</option>${S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${f.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <div class="card row" style="margin-top:12px;justify-content:space-around;text-align:center"><div><b class="serif" style="font-size:22px">${lv}</b><div class="small mut">🍞 ${L('loaves','леба')}</div></div><div><b class="serif" style="font-size:22px">${money(tot)}</b><div class="small mut">${L('total','вкупно')}</div></div><div><b class="serif" style="font-size:22px;color:${due?'var(--bad)':'var(--ok)'}">${money(due)}</b><div class="small mut">${L('unpaid','неплатено')}</div></div></div>`;
  if(!list.length)return html+`<div class="empty"><b>🧺</b>${L('No deliveries here yet.','Нема достави овде.')}</div>`;
  let cur='';
  for(const d of list){if(d.date!==cur){cur=d.date;const day=list.filter(x=>x.date===cur);html+=`<div class="day"><span>${fmtD(cur)}${cur===td?' · '+L('today','денес'):''}</span><span class="mut small" style="font-family:'DM Sans'">${day.reduce((a,x)=>a+loavesOf(x),0)} 🍞 · ${money(day.reduce((a,x)=>a+x.total,0))}</span></div>`}
    html+=`<div class="card dl" data-act="del" data-id="${d.id}" style="margin:8px 0">${dueOf(d)<=0?`<div class="stamp">${L('PAID','ПЛАТЕНО')}</div>`:''}<b>${esc(clientName(d.cid))}</b><div style="margin:2px 0 6px">${itemsText(d)}</div>
    <div class="row"><b class="serif">${money(d.total)}</b>${dueOf(d)>0?statusChip(d):''}<span class="sp"></span><span class="small mut">${esc(d.bn)}</span></div></div>`}
  return html;
}
function setF(k,v){S.f[k]=v;render()}

/* ================= TEAM / SETTINGS TAB ================= */
function settingsView(){
  const admin=isAdmin();
  return `<div class="card"><div class="row">${avatar(S.me,48)}<div class="sp"><b style="font-size:18px">${esc(S.me.name)}</b><div class="small mut">@${esc(S.me.username)} · ${admin?L('Owner','Сопственик'):L('Staff','Вработен')}</div></div>

/* ================= BUSINESS DETAIL (period, paid/unpaid, stats, log) ================= */
function periodFrom(){return S.bp==='all'?'0000':daysAgo(S.bp==='90'?89:29)}
function clientStats(cid,from){
  const ds=S.deliveries.filter(d=>d.cid===cid&&d.date>=from);
  const st={ds,n:ds.length,total:0,paid:0,due:0,loaves:0,top:null,wd:null,delay:null,weeks:[]};
  const prod={},wd={};let dw=0,da=0;
  for(const d of ds){st.total+=d.total;st.paid+=Math.min(d.total,paidOf(d));st.due+=dueOf(d);st.loaves+=loavesOf(d);
    for(const i of d.items)prod[i.n]=(prod[i.n]||{e:i.e,q:0});for(const i of d.items)prod[i.n].q+=i.q;
    const k=pd(d.date).getDay();wd[k]=(wd[k]||0)+1;
    for(const p of d.pays||[]){const dd=Math.max(0,daysBetween(d.date,ymd(new Date(p.t))));dw+=dd*p.a;da+=p.a}}
  const tp=Object.entries(prod).sort((a,b)=>b[1].q-a[1].q)[0];if(tp)st.top={n:tp[0],e:tp[1].e,q:tp[1].q};
  const tw=Object.entries(wd).sort((a,b)=>b[1]-a[1])[0];if(tw)st.wd=+tw[0];
  if(da>0)st.delay=dw/da;
  const W=S.bp==='30'?5:13;
  for(let i=W-1;i>=0;i--){const to=daysAgo(i*7),fr=daysAgo(i*7+6);
    st.weeks.push({label:pd(fr).toLocaleDateString(loc(),{day:'numeric',month:'numeric'}),n:ds.filter(d=>d.date>=fr&&d.date<=to).reduce((a,d)=>a+loavesOf(d),0),cur:i===0})}
  return st;
}

/* ================= EXPENSES (cost per loaf) ================= */
const CATS=[['flour','🌾','Flour','Брашно'],['yeast','🧫','Yeast','Квасец'],['sugar','🍬','Sugar','Шеќер'],['salt','🧂','Salt','Сол'],['oil','🫒','Oil / margarine','Масло / маргарин'],['electricity','💡','Electricity','Струја'],['water','💧','Water','Вода'],['gas','🔥','Gas / wood','Гас / дрва'],['wages','👷','Wages','Плати'],['packaging','📦','Packaging','Амбалажа'],['transport','🚚','Transport / fuel','Превоз / гориво'],['rent','🏠','Rent','Кирија'],['other','➕','Other','Друго']];
const catInfo=k=>{const c=CATS.find(x=>x[0]===k);return c?{e:c[1],n:L(c[2],c[3])}:{e:'🧾',n:k}};
const monthLabel=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,15).toLocaleDateString(loc(),{month:'long',year:'numeric'});
const shiftMonth=(m,d)=>{const t=new Date(+m.slice(0,4),+m.slice(5,7)-1+d,15);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')};
function expensesView(){
  const m=S.xm,ex=S.expenses.filter(e=>e.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.at.localeCompare(a.at));
  const tot=ex.reduce((a,e)=>a+e.amt,0),ds=S.deliveries.filter(d=>d.date.startsWith(m));
  const sales=ds.reduce((a,d)=>a+d.total,0),sold=ds.reduce((a,d)=>a+loavesOf(d),0);
  const mo=S.monthly.find(x=>x.id===m),made=mo&&mo.produced>0?mo.produced:sold;
  const cpl=made?tot/made:0,avgP=sold?sales/sold:0,ppl=avgP-cpl,profit=sales-tot;
  const by={};for(const e of ex)by[e.cat]=(by[e.cat]||0)+e.amt;
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const isCur=m===today().slice(0,7);
  return `<div class="row" style="margin:12px 0"><button class="btn ghost sm" style="flex:none" onclick="S.xm=shiftMonth(S.xm,-1);render()">‹</button><h2 class="sp" style="text-align:center;font-size:20px;text-transform:capitalize">${monthLabel(m)}</h2><button class="btn ghost sm" style="flex:none" ${isCur?'disabled':''} onclick="S.xm=shiftMonth(S.xm,1);render()">›</button></div>
  <div class="card" style="background:linear-gradient(135deg,#fff3d6,#fffaf1)"><div class="small mut">${L('Cost to make one loaf','Цена за правење на еден леб')}</div>
  <div class="serif" style="font-size:38px;color:var(--crust2)">${made?cpl.toFixed(2)+(lang==='mk'?' ден.':' MKD'):'—'}</div>
  <div class="small mut">${money(tot)} ${L('total expenses','вкупно трошоци')} ÷ ${made} 🍞</div></div>
  <div class="grid2"><div class="kpi"><span class="small mut">${L('Average selling price','Просечна продажна цена')}</span><b>${sold?avgP.toFixed(2):'—'}</b><span class="small mut">${L('per loaf','по леб')}</span></div>
  <div class="kpi ${ppl>=0?'ok':'bad'}"><span class="small mut">${L('Profit per loaf','Профит по леб')}</span><b>${made&&sold?(ppl>=0?'+':'')+ppl.toFixed(2):'—'}</b><span class="small mut">${made&&sold&&avgP?Math.round(ppl/avgP*100)+'% '+L('margin','маргина'):''}</span></div>
  <div class="kpi"><span class="small mut">${L('Sales this month','Продажба овој месец')}</span><b>${money(sales)}</b><span class="small mut">${sold} 🍞 ${L('delivered','доставени')}</span></div>
  <div class="kpi ${profit>=0?'ok':'bad'}"><span class="small mut">${L('Total profit','Вкупен профит')}</span><b>${money(profit)}</b></div></div>
  <div class="card"><div class="small mut" style="margin-bottom:4px">${L('Loaves made this month (optional — if empty, delivered loaves are used)','Испечени леба овој месец (опционално — ако е празно, се користат доставените)')}</div>
  <input type="number" inputmode="numeric" placeholder="${sold}" value="${mo&&mo.produced>0?mo.produced:''}" onchange="w(()=>api('write','POST',{op:'set',coll:'monthly',id:S.xm,data:{produced:this.value}}))"></div>

  <div class="row small" style="margin-top:6px"><span class="sp">⬇ ${L('Received','Примено')} <b style="color:var(--ok)">${money(inn)}</b></span><span class="sp" style="text-align:right">⬆ ${L('Spent','Потрошено')} <b style="color:var(--bad)">${money(out)}</b></span></div></div>
  <div class="card"><div class="row"><h3 class="sp" style="margin:0">💰 ${L('Payments received','Примени плаќања')}</h3><button class="btn sm" data-act="newpay">＋ ${L('Record','Запиши')}</button></div>
  ${rec.length?`<div class="list" style="margin-top:6px">${rec.map(r=>`<div class="it" data-act="client" data-id="${r.cid}"><div class="sp"><b>${esc(clientName(r.cid))}</b><div class="small mut">${new Date(r.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${esc(r.bn)}</div></div><b style="color:var(--ok)">+${money(r.a)}</b></div>`).join('')}</div>`:`<div class="empty"><b>🪙</b>${L('Nobody has paid on this day yet.','Никој не платил овој ден.')}</div>`}</div>
  ${ex.length?`<div class="card"><h3>⬆ ${L('Spent','Потрошено')}</h3><div class="list">${ex.map(e=>{const ci=catInfo(e.cat);return `<div class="it" data-act="editexp" data-id="${e.id}"><span style="font-size:20px">${ci.e}</span><div class="sp"><b>${esc(ci.n)}</b>${e.note?`<div class="small mut">${esc(e.note)}</div>`:''}</div><b style="color:var(--bad)">−${money(e.amt)}</b></div>`}).join('')}</div></div>`:''}
  <div class="card"><h3>🧮 ${L('Close the day','Затвори го денот')}</h3>
  ${closed?`<div class="row"><div class="sp"><div class="small mut">${L('Counted','Избројано')} · ${esc(closed.bn)}</div><b class="serif" style="font-size:24px">${money(closed.counted)}</b></div>${diffChip(closed.counted-closed.expected)}</div>${closed.note?`<div class="small" style="margin-top:6px">📝 ${esc(closed.note)}</div>`:''}<button class="btn ghost full" style="margin-top:10px" data-act="count">${L('Count again','Изброј повторно')}</button>`
  :`<div class="small mut" style="margin-bottom:8px">${L('Count the notes in the till and the app compares it with what it expects.','Изброј ги банкнотите во касата и апликацијата ги споредува со очекуваното.')}</div><button class="btn full" data-act="count">🧮 ${L('Count the till','Изброј ја касата')}</button>`}</div>
  ${hist.length?`<div class="card"><h3>📒 ${L('Closed days','Затворени денови')}</h3><div class="list">${hist.map(c=>`<div class="it" onclick="S.cd='${c.id}';render();scrollTo(0,0)"><div class="sp"><b>${fmtD(c.id)}</b><div class="small mut">${L('counted','избројано')} ${money(c.counted)}</div></div>${diffChip(c.counted-c.expected)}</div>`).join('')}</div></div>`:''}`;
}
const daysAgoFrom=(d,n)=>ymd(new Date(pd(d).getTime()+n*864e5));
function openCount(){
  const day=S.cd,{expected,closed}=dayData(day);const nt=(closed&&closed.notes)||{};
  openSheet({tall:true,title:'🧮 '+L('Count the till','Изброј ја касата'),
  body:`<div class="small mut" style="margin:6px 0">${fmtD(day)} · ${L('should be','треба да е')} <b>${money(expected)}</b></div>
  ${DEN.map(d=>`<div class="prow" data-den="${d}"><div class="row"><b class="sp">${d.toLocaleString('en-US')} ${lang==='mk'?'ден.':'MKD'}</b><span class="small mut cs"></span></div><div class="stepper"><button type="button" onclick="cstep(this,-1)">−</button><input class="q" type="number" inputmode="numeric" min="0" value="${nt[d]||0}" oninput="ccalc()"><button type="button" onclick="cstep(this,1)">+</button><button type="button" onclick="cstep(this,5)">+5</button></div></div>`).join('')}
  <label class="f">${L('Coins / other money','Ситни / друго')} (${lang==='mk'?'ден.':'MKD'})</label><input id="c-other" type="number" inputmode="decimal" value="${(closed&&closed.other)||''}" oninput="ccalc()">
  <label class="f">${L('Note (optional)','Белешка (опционално)')}</label><input id="c-note" value="${esc(closed?closed.note:'')}" placeholder="${L('e.g. 500 given to driver','пр. 500 дадени на возачот')}">`,
  footer:`<div class="row" style="margin-bottom:8px"><span class="sp"><span class="small mut">${L('Counted','Избројано')}</span><br><b class="serif" style="font-size:24px" id="c-total">0</b></span><span id="c-diff"></span></div><button class="btn full" data-act="closeday">${L('Save & close the day','Зачувај и затвори го денот')}</button>`});
  ccalc();
}
function cstep(btn,d){const i=btn.closest('.stepper').querySelector('.q');i.value=Math.max(0,(+i.value||0)+d);ccalc()}
function cRead(){const notes={};let tot=0;document.querySelectorAll('#pb [data-den]').forEach(r=>{const c=Math.round(+r.querySelector('.q').value||0);if(c){notes[r.dataset.den]=c;tot+=c*+r.dataset.den}});const other=+val('#c-other')||0;return {notes,other,total:tot+other}}
function ccalc(){const c=cRead(),{expected}=dayData(S.cd);document.querySelectorAll('#pb [data-den]').forEach(r=>{const n=+r.querySelector('.q').value||0;r.classList.toggle('on',n>0);r.querySelector('.cs').textContent=n?'= '+money(n*+r.dataset.den):''});
  $('#c-total').textContent=money(c.total);$('#c-diff').innerHTML=diffChip(c.total-expected)}
acts.count=()=>openCount();
acts.closeday=async()=>{const c=cRead(),{expected}=dayData(S.cd);
  if(await w(()=>api('write','POST',{op:'set',coll:'cashdays',id:S.cd,data:{notes:c.notes,other:c.other,expected,note:val('#c-note')}}))){closeSheet();toast('✓ '+L('Day closed','Денот е затворен'))}};
function openPay(){
  const cl=S.clients.slice().sort((a,b)=>(D.byC[b.id].due>0)-(D.byC[a.id].due>0)||a.name.localeCompare(b.name));
  if(!cl.length){toast(L('Add a business first','Прво додади фирма'));return}
  openSheet({title:'💰 '+L('Record a payment','Запиши плаќање'),
  body:`<label class="f">${L('Who paid?','Кој плати?')}</label><select id="pp-c" onchange="payClient(this.value)">${cl.map(c=>`<option value="${c.id}">${esc(c.name)}${D.byC[c.id].due>0?' — '+money(D.byC[c.id].due):''}</option>`).join('')}</select>
  <label class="f">${L('Amount received','Примен износ')}</label><input id="pp-a" type="number" inputmode="decimal"><div class="small mut" id="pp-h" style="margin-top:6px"></div>`,
  footer:`<button class="btn ok full" data-act="savepay">✓ ${L('Save payment','Зачувај плаќање')}</button>`});
  payClient(cl[0].id);
}
function payClient(id){const due=D.byC[id].due;$('#pp-a').value=due||'';$('#pp-h').textContent=due?L('Applied to the oldest unpaid deliveries first.','Се применува на најстарите неплатени достави.'):L('This business owes nothing right now.','Оваа фирма моментално не должи.')}
acts.newpay=()=>openPay();
acts.savepay=async()=>{const cid=val('#pp-c'),a=+val('#pp-a')||0,due=D.byC[cid].due;if(a<=0){toast(L('Enter an amount','Внеси износ'));return}if(!due){toast(L('Nothing to pay for this business','Нема што да се плати за оваа фирма'));return}
  if(await w(()=>api('write','POST',{op:'collect',cid,amount:a}))){closeSheet();toast('💰 '+clientName(cid)+' · '+money(Math.min(a,due)))}};

/* ================= BACKUP / EXPORT / INSTALL ================= */
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:type||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
acts.dl=el=>{const k=el.dataset.k,d=today();
  if(k==='deliveries')download(`deliveries-${d}.csv`,'\uFEFF'+[['Date','Business','Items','Loaves','Total','Paid','Due','Added by'],...S.deliveries.slice().reverse().map(x=>[x.date,clientName(x.cid),x.items.map(i=>`${i.n} x${i.q} @${i.p}`).join('; '),loavesOf(x),x.total,paidOf(x),dueOf(x),x.bn])].map(r=>r.map(csvq).join(',')).join('\r\n'));
  else if(k==='payments')download(`payments-${d}.csv`,'\uFEFF'+[['Date received','Business','Amount','Delivery date','Recorded by'],...S.deliveries.flatMap(x=>(x.pays||[]).map(p=>[p.t.slice(0,10),clientName(x.cid),p.a,x.date,p.bn]))].map(r=>r.map(csvq).join(',')).join('\r\n'));
  else if(k==='expenses')download(`expenses-${d}.csv`,'\uFEFF'+[['Date','Category','Amount','Note','Added by'],...S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,catInfo(e.cat).n,e.amt,e.note,e.bn])].map(r=>r.map(csvq).join(',')).join('\r\n'));
  else download(`bread-route-backup-${d}.json`,JSON.stringify({exportedAt:new Date().toISOString(),clients:S.clients,products:S.products,deliveries:S.deliveries,expenses:S.expenses,monthly:S.monthly,cashdays:S.cashdays,settings:S.settings},null,1),'application/json');
};
acts.emailbk=async el=>{el.disabled=true;try{const r=await api('backup','POST',{});toast('📧 '+L('Backup sent to ','Копијата е пратена на ')+r.to)}catch(e){toast(errText(e))}el.disabled=false};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e;const b=$('#inst');if(b)b.style.display='block'});
acts.install=async()=>{const e=window.__bip;if(!e)return;e.prompt();try{await e.userChoice}catch(_){}window.__bip=null;const b=$('#inst');if(b)b.style.display='none'};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

boot();
</script>
</body>
</html>
